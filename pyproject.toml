[project]
name = "llm-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pii = ["gliner>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

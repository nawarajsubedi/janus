services:
  proxy:
    build: .
    restart: unless-stopped
    ports: ["8001:8001"]
    env_file: .env
    environment:
      PII_ENABLED: "true"
    volumes:
      - models:/models   # caches the GLiNER weights between restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 15s
      start_period: 120s

volumes:
  models:
